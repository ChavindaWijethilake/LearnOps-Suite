version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: learnops-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: learnops_dev
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infrastructure/database/postgres-init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres" ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - learnops-network

  gateway:
    build:
      context: .
      dockerfile_inline: |
        FROM node:20-alpine
        WORKDIR /app
        COPY package.json pnpm-lock.yaml pnpm-workspace.yaml ./
        RUN npm install -g pnpm && pnpm fetch
        COPY . .
        RUN pnpm install -r --offline
        WORKDIR /app/apps/gateway
        CMD ["pnpm", "dev"]
    ports:
      - "4000:4000"
    depends_on:
      - portal
      # - billing # These services are not defined in the original or new content, commenting out
      # - service_management # These services are not defined in the original or new content, commenting out
    networks:
      - learnops-network

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./infrastructure/reverse-proxy/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - gateway
    networks:
      - learnops-network

  prometheus:
    image: prom/prometheus:latest
    ports:
      - "9090:9090"
    volumes:
      - ./infrastructure/monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    networks:
      - learnops-network

  grafana:
    image: grafana/grafana:latest
    ports:
      - "3000:3000" # Warning: conflicts with Portal if run locally on host
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    volumes:
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
    networks:
      - learnops-network

  portal:
    build:
      context: .
      dockerfile: apps/core/portal/Dockerfile
    container_name: learnops-portal
    ports:
      - "3010:3000"
    environment:
      - DATABASE_URL=postgresql://postgres:postgrespassword@postgres:5432/learnops_dev
      - NEXTAUTH_SECRET=supersecretkey123
      - NEXT_PUBLIC_API_URL=http://localhost:3010/api
    depends_on:
      - postgres
    networks:
      - learnops-network

volumes:
  postgres_data:
  prometheus_data:
  grafana_data:


networks:
  learnops-network:
    driver: bridge
